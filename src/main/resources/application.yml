spring:
  application:
    name: vistay-user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vistay_user_db}
    username: ${DB_USERNAME:vistay}
    password: ${DB_PASSWORD:vistay}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD:}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:vistay-user}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_BACKOFFICE_ISSUER:http://localhost:8180/realms/vistay-backoffice}
          jwk-set-uri: ${KEYCLOAK_BACKOFFICE_JWKS_URI:http://localhost:8180/realms/vistay-backoffice/protocol/openid-connect/certs}
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}
      ssl:
        enabled: ${GRPC_TLS_ENABLED:true}
        bundle: ${GRPC_SSL_BUNDLE:grpc-server}
        client-auth: require
  ssl:
    bundle:
      pem:
        grpc-server:
          keystore:
            certificate: ${GRPC_SERVER_CERT:file:/run/secrets/grpc/server.crt}
            private-key: ${GRPC_SERVER_KEY:file:/run/secrets/grpc/server.key}
          truststore:
            certificate: ${GRPC_CLIENT_CA_CERT:file:/run/secrets/grpc/ca.crt}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: logstash

vistay:
  security:
    audience: ${KEYCLOAK_BACKOFFICE_AUDIENCE:vistay-backoffice-api}
  topics:
    account-provisioned: ${ACCOUNT_PROVISIONED_TOPIC:vistay.auth.account-provisioned.v1}
  outbox:
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:1000}
    send-timeout-seconds: ${OUTBOX_SEND_TIMEOUT_SECONDS:10}
  grpc:
    allowed-caller-uris: ${GRPC_ALLOWED_CALLER_URIS:spiffe://vistay/service/authentication}
    maximum-deadline: ${GRPC_MAXIMUM_DEADLINE:2s}
